# cargo-deny configuration: licenses, bans and sources.
# Katna PDF is GPL-3.0-or-later; every dependency license must be compatible.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # GPUI stays in the app and Katna's UI crates; the renderer and tools
    # never depend on it (docs/PLAN.md).
    { crate = "gpui-pre", wrappers = ["katna-pdf", "katna-ui", "gpui-pre-platform", "gpui-pre-linux", "gpui-pre-wgpu", "gpui-pre-apple", "gpui-pre-macos", "gpui-pre-windows", "gpui-pre-web"], reason = "GPUI is only allowed in the app" },
    { crate = "gpui-pre-platform", wrappers = ["katna-pdf", "katna-ui"], reason = "GPUI is only allowed in the app" },
    # TLS is rustls only, as in Katna.
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/QuakeString/katna"]
