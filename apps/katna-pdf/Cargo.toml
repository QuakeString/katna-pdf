[package]
name = "katna-pdf"
description = "Katna PDF: a fast PDF reader, editor and signer in the Katna family."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
katna-pdf-render.workspace = true
katna-pdf-cos.workspace = true
katna-pdf-library.workspace = true
notify.workspace = true
katna-pdf-sign.workspace = true
katna-core.workspace = true
katna-dbus.workspace = true
katna-store.workspace = true
mail-parser.workspace = true
futures-lite.workspace = true
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
katna-ui.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
image.workspace = true
async-channel.workspace = true

# The desktop's print dialog: Linux only.
[target.'cfg(not(windows))'.dependencies]
ashpd.workspace = true

# KDE's global menu (`menu.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
katna-platform.workspace = true
zbus.workspace = true

# The icon and description on Windows (`build.rs`).
[build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true
