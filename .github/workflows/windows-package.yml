name: Windows package

# Builds Katna PDF for Windows: Katna PDF Setup (apps/katna-pdf-setup,
# which carries the app, katna-pdf-cli and the icon) and a zip of the same
# files for those who'd rather not install. On main, once CI passed, they
# replace the ones on the `windows-latest` pre-release, so Windows users
# can try Katna PDF without building it.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!bakeoff/**"
      - "!parity/**"
  pull_request:
    paths:
      - "packaging/windows/**"
      - "apps/katna-pdf-setup/**"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: bash
        run: |
          # The version the app reports and compares updates with.
          export KATNA_PDF_VERSION=$(packaging/linux/version.sh)
          export KATNA_VERSION=$KATNA_PDF_VERSION
          cargo build --locked --release --package katna-pdf --package katna-pdf-cli
      - name: Make the zip
        shell: bash
        run: |
          version=$(packaging/linux/version.sh)
          dir=KatnaPDF-windows-x86_64
          mkdir -p "out/$dir"
          cp target/release/katna-pdf.exe target/release/katna-pdf-cli.exe "out/$dir/"
          cp LICENSE "out/$dir/LICENSE.txt"
          sed "s/@VERSION@/$version/" packaging/windows/README.txt > "out/$dir/README.txt"
          cp packaging/windows/katna-pdf.ico "out/$dir/"
          (cd out && 7z a -tzip "$dir.zip" "$dir" > /dev/null)
      - name: Build Setup
        shell: bash
        run: |
          # Setup carries the zip's files, packed into it by its build.rs.
          export KATNA_PDF_SETUP_PAYLOAD="$PWD/out/KatnaPDF-windows-x86_64"
          export KATNA_PDF_VERSION=$(packaging/linux/version.sh)
          cargo build --locked --release --package katna-pdf-setup
          cp target/release/katna-pdf-setup.exe out/KatnaPDFSetup-x86_64.exe
          # For Katna PDF's own update check.
          packaging/update-manifest.sh "$KATNA_PDF_VERSION" out \
            out/KatnaPDFSetup-x86_64.exe out/KatnaPDF-windows-x86_64.zip
          ls -l out
      - name: Try it
        shell: bash
        run: |
          dir=out/KatnaPDF-windows-x86_64
          "$dir/katna-pdf-cli.exe" info ci/package-test.pdf
          # The app starts and stays up with the file open.
          "$dir/katna-pdf.exe" ci/package-test.pdf &
          sleep 15
          tasklist //FI "IMAGENAME eq katna-pdf.exe" | grep -i katna-pdf.exe
          taskkill //F //IM katna-pdf.exe
      - name: Install with Setup, open, and remove
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path out/KatnaPDFSetup-x86_64.exe).Path
          $p = Start-Process $setup -ArgumentList '--quiet','--desktop' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed: $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Katna PDF'
          foreach ($f in 'katna-pdf.exe','katna-pdf-cli.exe','katna-pdf.ico','katna-pdf-setup.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KatnaPDF'
          Get-ItemProperty $uninstall | Format-List DisplayName, DisplayVersion, UninstallString
          Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids' -Name 'KatnaPDF.Document' | Out-Null
          Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -Name 'Katna PDF' | Out-Null
          $start = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Katna PDF.lnk'
          if (-not (Test-Path $start)) { throw 'no Start menu shortcut' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Katna PDF.lnk'))) { throw 'no desktop shortcut' }
          # The installed app opens a PDF and stays up.
          $pdf = (Resolve-Path ci/package-test.pdf).Path
          $app = Start-Process (Join-Path $dir 'katna-pdf.exe') -ArgumentList "`"$pdf`"" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Katna PDF exited: $($app.ExitCode)" }
          # Running it again updates in place, and closes the open app first.
          $p = Start-Process $setup -ArgumentList '--quiet','--update' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Update failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Katna PDF.lnk'))) { throw 'update lost the desktop shortcut' }
          # Removing it, as Settings > Apps would.
          $p = Start-Process (Join-Path $dir 'katna-pdf-setup.exe') -ArgumentList '--uninstall','--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          foreach ($try in 1..30) { if (-not (Test-Path $dir)) { break }; Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { throw "$dir is still there" }
          if (Test-Path $uninstall) { throw 'the uninstall entry is still there' }
          if (Test-Path $start) { throw 'the Start menu shortcut is still there' }
          if (Test-Path 'HKCU:\Software\Classes\KatnaPDF.Document') { throw 'PDF registration is still there' }
          Write-Output 'Setup installed, opened, updated and removed Katna PDF.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-zip
          path: |
            out/KatnaPDF-windows-x86_64.zip
            out/KatnaPDFSetup-x86_64.exe
            out/katna-pdf-update.txt
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: windows-package-release
      cancel-in-progress: false
    steps:
      # Only a commit whose CI passed is published.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 120); do
            result=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | "\(.status) \(.conclusion)"] | first // "none"')
            echo "CI on $GITHUB_SHA: $result"
            case "$result" in
              "completed success") exit 0 ;;
              "completed cancelled" | "completed skipped") exit 0 ;;
              completed*) echo "CI did not pass; not publishing"; exit 1 ;;
            esac
            sleep 60
          done
          echo "CI did not finish in two hours; not publishing"
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-zip
          path: out
      - name: Publish to the windows-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="The newest build of main for Windows 10 and 11. Download
          KatnaPDFSetup-x86_64.exe and run it; it installs without an
          administrator, and Settings > Apps removes it. Or unpack
          KatnaPDF-windows-x86_64.zip anywhere and run katna-pdf.exe. Neither
          is signed yet, so Windows may ask before running it the first time
          (More info, then Run anyway)."
          if gh release view windows-latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/windows-latest" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit windows-latest --notes "$notes"
          else
            gh release create windows-latest --prerelease --target "$GITHUB_SHA" \
              --title "Katna PDF for Windows (latest)" --notes "$notes"
          fi
          # The update manifest last, once the files it describes are up.
          gh release upload windows-latest out/KatnaPDF-windows-x86_64.zip out/KatnaPDFSetup-x86_64.exe --clobber
          gh release upload windows-latest out/katna-pdf-update.txt --clobber
