name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev softhsm2 opensc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        shell: bash
        # Each test's panic is also raised as an annotation, which the checks
        # API returns where the log itself cannot be fetched.
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast > test.log 2>&1
          status=$?
          cat test.log
          awk '/panicked at/ { n = 5; msg = "" } n > 0 { msg = msg $0 "%0A"; n--; if (n == 0) print "::error::" msg }' test.log | head -10
          exit $status

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        shell: bash
        # Each test's panic is also raised as an annotation, which the checks
        # API returns where the log itself cannot be fetched.
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast > test.log 2>&1
          status=$?
          cat test.log
          awk '/panicked at/ { n = 5; msg = "" } n > 0 { msg = msg $0 "%0A"; n--; if (n == 0) print "::error::" msg }' test.log | head -10
          exit $status

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources
