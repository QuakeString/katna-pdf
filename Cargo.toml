[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# We always build with the latest stable Rust (rust-toolchain.toml), as
# Katna does; raise this deliberately when we need newer Rust.
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/QuakeString/katna-pdf"
publish = false

[workspace.dependencies]
katna-pdf-render = { path = "crates/katna-pdf-render" }

# Katna's shared UI crates, at a pinned commit of the Katna repository
# (docs/PLAN.md §2.2). Move the pin deliberately, together with the
# [patch.crates-io] entries below.
katna-core = { git = "https://github.com/QuakeString/katna", rev = "fc6069710d6a9ab214d0a995c3d5b8603c63b1c1" }
katna-ui = { git = "https://github.com/QuakeString/katna", rev = "fc6069710d6a9ab214d0a995c3d5b8603c63b1c1" }

# GPUI as Katna builds it: the same versions, patched from Katna's vendor/.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["wayland", "x11"] }

# Third-party crates. Pin minor versions; upgrade deliberately.
# Pure-Rust PDF rasterizer (docs/PLAN.md §3.1; the Phase 0 bake-off may
# add PDFium or MuPDF behind the same trait).
hayro = "0.8.0"
image = { version = "0.25", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Katna's patched GPUI (KDE global menu, blur, line breaking, right-to-left
# layout). Cargo applies patches only from the top-level workspace, so we
# repeat Katna's [patch.crates-io] here, from the same commit as katna-ui.
[patch.crates-io]
# hayro with Katna PDF's fixes; vendor/hayro/KATNA.md lists them.
hayro = { path = "vendor/hayro" }
gpui-pre = { git = "https://github.com/QuakeString/katna", rev = "fc6069710d6a9ab214d0a995c3d5b8603c63b1c1" }
gpui-pre-linux = { git = "https://github.com/QuakeString/katna", rev = "fc6069710d6a9ab214d0a995c3d5b8603c63b1c1" }
gpui-pre-wgpu = { git = "https://github.com/QuakeString/katna", rev = "fc6069710d6a9ab214d0a995c3d5b8603c63b1c1" }
gpui-pre-windows = { git = "https://github.com/QuakeString/katna", rev = "fc6069710d6a9ab214d0a995c3d5b8603c63b1c1" }
