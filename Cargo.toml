[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]
exclude = ["bakeoff", "vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# We always build with the latest stable Rust (rust-toolchain.toml), as
# Katna does; raise this deliberately when we need newer Rust.
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/QuakeString/katna-pdf"
publish = false

[workspace.dependencies]
katna-pdf-render = { path = "crates/katna-pdf-render" }
katna-pdf-cos = { path = "crates/katna-pdf-cos" }
katna-pdf-sign = { path = "crates/katna-pdf-sign" }
katna-pdf-library = { path = "crates/katna-pdf-library" }

# Katna's shared UI crates, at a pinned commit of the Katna repository
# (docs/PLAN.md §2.2). Move the pin deliberately, together with the
# [patch.crates-io] entries below.
katna-core = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
katna-ui = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
katna-platform = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
# The Katna daemon's D-Bus API: cloud drives of Katna Mail's accounts.
katna-dbus = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
# Katna Mail's store, read-only: the PDFs attached to mail.
katna-store = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }

# GPUI as Katna builds it: the same versions, patched from Katna's vendor/.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["wayland", "x11"] }

# Third-party crates. Pin minor versions; upgrade deliberately.
# Pure-Rust PDF rasterizer (docs/PLAN.md §3.1; the Phase 0 bake-off may
# add PDFium or MuPDF behind the same trait).
hayro = "0.8.0"
image = { version = "0.25", default-features = false }
# Requests from later launches to the running app (already in GPUI's tree).
async-channel = "2.5"
futures-lite = "2.6"
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
# The desktop's print dialog (XDG print portal), as Katna Mail uses it;
# already in GPUI's tree for file dialogs.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "print"] }
# Flate for xref and object streams; the pure-Rust backend (miniz_oxide).
# Fonts' character maps (ToUnicode) and glyph names, for editing text.
hayro-cmap = { version = "0.1.0", default-features = false }
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Signing (docs/PLAN.md §3.3, §4.4): RustCrypto, all pure Rust, kept on
# one generation (der 0.7) so the crates share their types.
cms = "0.2.3"
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["alloc", "derive", "oid", "std"] }
spki = { version = "0.7", features = ["alloc"] }
x509-cert = { version = "0.2", default-features = false, features = ["std", "pem"] }
# The system's root certificates, to check signers' certificates against.
rustls-native-certs = "0.8"
x509-ocsp = { version = "0.2", features = ["std"] }
x509-tsp = "0.1"
# Signing tokens through their PKCS#11 modules (OpenSC, vendors' own).
cryptoki = "0.12"
# Timestamp servers (RFC 3161) over HTTP; TLS through rustls, trusting
# the system's roots as Katna does.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
pkcs12 = { version = "0.1", features = ["kdf"] }
pkcs5 = { version = "0.7", features = ["pbes2", "alloc"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
hmac = "0.12"
des = "0.8"
rc2 = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes = "0.8"
md-5 = "0.10"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
zune-core = "0.5"
# The library's catalog and full-text index (docs/PLAN.md §4.6): SQLite
# with FTS5, at the version Katna uses.
rusqlite = { version = "0.40", features = ["bundled"] }
# Watched folders read again when their PDFs change (the library).
mail-parser = "0.11.9"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
zune-jpeg = "0.5"
hayro-ccitt = { version = "0.4", default-features = false }
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std", "simd"] }
hayro-jpeg2000 = { version = "0.4", default-features = false, features = ["std", "simd"] }
unicode-normalization = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Katna's patched GPUI (KDE global menu, blur, line breaking, right-to-left
# layout). Cargo applies patches only from the top-level workspace, so we
# repeat Katna's [patch.crates-io] here, from the same commit as katna-ui.
[patch.crates-io]
# hayro with Katna PDF's fixes; each crate's KATNA.md lists them.
hayro = { path = "vendor/hayro" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-syntax = { path = "vendor/hayro-syntax" }
gpui-pre = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
gpui-pre-linux = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
gpui-pre-wgpu = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
gpui-pre-windows = { git = "https://github.com/QuakeString/katna", rev = "a201ec5c904a7da7f174f3da066a7dc9a9b78387" }
