[package]
name = "katna-pdf-ocr-bakeoff"
description = "Phase 0 OCR bake-off: ocrs and PP-OCR on rten against Tesseract (docs/PLAN.md §4.9)."
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Not part of the workspace: a measuring tool, run by hand.
[workspace]

[dependencies]
ocrs = "0.13"
rten = { version = "0.26", features = ["onnx_format"] }
rten-imageproc = "0.26"
rten-tensor = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"

[profile.release]
debug = false
